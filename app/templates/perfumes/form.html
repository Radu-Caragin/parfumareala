{% extends "base.html" %}

{% block title %}{{ heading }} - Perfume Price Tracker{% endblock %}

{% block content %}
<h1>{{ heading }}</h1>

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

<form method="post" action="{{ action_url }}" class="perfume-form">
    <label for="brand">Brand</label>
    <input type="text" id="brand" name="brand" value="{{ brand or '' }}" required>

    <label for="name">Perfume name</label>
    <input type="text" id="name" name="name" value="{{ name or '' }}" required>

    <div class="form-actions">
        <button type="submit" class="button">{{ submit_label }}</button>
        <a href="{{ cancel_url }}" class="button secondary">Cancel</a>
    </div>
</form>
{% endblock %}
