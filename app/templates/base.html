<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Perfume Price Tracker{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
    <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="/">Perfume Price Tracker</a>
            <nav>
                <a href="/" class="{{ 'active' if request.url.path == '/' else '' }}">Dashboard</a>
                <a href="/stores" class="{{ 'active' if request.url.path.startswith('/stores') else '' }}">Stores</a>
            </nav>
        </div>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
