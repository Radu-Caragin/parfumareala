<!DOCTYPE html>
<html>
<head><title>Narcotic Delight Initio Parfums Prives perfume - a fragrance for women and men 2024</title></head>
<body>
<h1 class="text-2xl" itemprop="name">
    Narcotic Delight Initio Parfums Prives
    <span class="text-lg">for women and men</span>
</h1>

<div class="text-center">
    <div class="flex flex-col items-center pb-4">
        <h6 class="text-sm font-semibold">main accords</h6>
        <div class="flex flex-col w-full max-w-[280px] md:max-w-[320px]">
            <div class="w-full">
                <div class="h-5 md:h-7 rounded-br-lg" style="color: #FFFFFF; background: #ee363b; opacity: 100%; width: 100%;">sweet</div>
            </div>
            <div class="w-full">
                <div class="h-5 md:h-7 rounded-br-lg" style="color: #000000; background: #FFFEC0; opacity: 79.48%; width: 76.06%;">vanilla</div>
            </div>
            <div class="w-full">
                <div class="h-5 md:h-7 rounded-br-lg" style="color: #FFFFFF; background: #ce1d33; opacity: 77.68%; width: 73.97%;">cherry</div>
            </div>
        </div>
    </div>
</div>

<div class="md:mb-6" id="pyramid">
    <div class="p-5">
        <pyramid-switch-new :perfume_id="89368">
            <div class="mt-6 space-y-1">
                <h4>Top Notes</h4>
                <pyramid-level-new notes="top">
                    <div class="flex flex-wrap">
                        <a class="pyramid-note-link" href="https://www.fragrantica.com/notes/Cherry-297.html">
                            <span class="pyramid-note-label">Cherry</span>
                        </a>
                        <a class="pyramid-note-link" href="https://www.fragrantica.com/notes/Pink-Pepper-91.html">
                            <span class="pyramid-note-label">Pink Pepper</span>
                        </a>
                    </div>
                </pyramid-level-new>
                <h4>Heart Notes</h4>
                <pyramid-level-new notes="middle">
                    <div class="flex flex-wrap">
                        <a class="pyramid-note-link" href="https://www.fragrantica.com/notes/Cognac-280.html">
                            <span class="pyramid-note-label">Cognac</span>
                        </a>
                    </div>
                </pyramid-level-new>
                <h4>Base Notes</h4>
                <pyramid-level-new notes="base">
                    <div class="flex flex-wrap">
                        <a class="pyramid-note-link" href="https://www.fragrantica.com/notes/Tobacco-96.html">
                            <span class="pyramid-note-label">Tobacco</span>
                        </a>
                        <a class="pyramid-note-link" href="https://www.fragrantica.com/notes/Vanilla-74.html">
                            <span class="pyramid-note-label">Vanilla</span>
                        </a>
                    </div>
                </pyramid-level-new>
            </div>
        </pyramid-switch-new>
    </div>
</div>

<lazy-section-new root-margin="400px 0px" section-id="similar">
    <div id="similar">
        <similar-perfumes-new :perfume_id="89368" title="This perfume reminds me of"></similar-perfumes-new>
    </div>
</lazy-section-new>
</body>
</html>
